name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare or create release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            output: postgres-read-windows-x64.exe
            archive: postgres-read-windows-x64.zip
            format: zip
          - target: linux-x64
            output: postgres-read-linux-x64
            archive: postgres-read-linux-x64.tar.gz
            format: tar
          - target: linux-arm64
            output: postgres-read-linux-arm64
            archive: postgres-read-linux-arm64.tar.gz
            format: tar
          - target: macos-x64
            output: postgres-read-macos-x64
            archive: postgres-read-macos-x64.tar.gz
            format: tar
          - target: macos-arm64
            output: postgres-read-macos-arm64
            archive: postgres-read-macos-arm64.tar.gz
            format: tar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build executable
        run: bun run scripts/build.ts ${{ matrix.target }}

      - name: Package Windows executable
        if: matrix.format == 'zip'
        working-directory: dist
        run: zip ${{ matrix.archive }} ${{ matrix.output }}

      - name: Package Unix executable
        if: matrix.format == 'tar'
        working-directory: dist
        run: |
          chmod +x ${{ matrix.output }}
          tar -czf ${{ matrix.archive }} ${{ matrix.output }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish-assets:
    name: Publish release assets
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum postgres-read-* > SHA256SUMS.txt

      - name: Attach assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
